name: Release
# Push a tag like v0.2.0 to build the .deb and publish a GitHub Release.
# Pull requests that touch the packaging machinery run the same build as a
# dry run (nothing is published). See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - debian/**
      - packaging/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Ubuntu 24.04 is the oldest platform we build for: the package's glibc and
    # library requirements come from the machine that builds it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libglib2.0-dev pkg-config dpkg-dev desktop-file-utils xvfb xauth
      - run: rustup update stable && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: xvfb-run -a cargo test --locked
      - run: cargo build --locked --release
      - run: desktop-file-validate packaging/*.desktop && bash scripts/package.sh
      - name: Installs, verifies and removes cleanly
        run: |
          sudo apt-get install -y ./dist/luma-launcher_*.deb
          luma-launcher --version
          man -w luma-launcher
          sudo dpkg --verify luma-launcher
          sudo apt-get remove -y luma-launcher
          test ! -e /usr/bin/luma-launcher
      - name: Checksums
        working-directory: dist
        run: sha256sum luma-launcher_*.deb | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: luma-launcher-deb
          path: |
            dist/luma-launcher_*.deb
            dist/SHA256SUMS
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: luma-launcher-deb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb=$(ls luma-launcher_*.deb)
          cat >notes.md <<EOF
          ## Install

          \`\`\`bash
          sudo apt install ./$deb
          \`\`\`

          Debian 13 / Ubuntu 24.04 or newer, amd64. Verify the download with
          \`sha256sum -c SHA256SUMS\`.
          EOF
          gh release create "$GITHUB_REF_NAME" "$deb" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Luma Launcher ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --generate-notes
