name: Rust and Debian Stable
on: [push, pull_request]
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: apt-get update && apt-get install -y --no-install-recommends libgtk-4-dev libglib2.0-dev pkg-config dpkg-dev desktop-file-utils shellcheck shfmt
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo install --locked cargo-audit && cargo audit
      - run: cargo build --locked --release
      - run: bash scripts/test-install.sh
      - run: shellcheck scripts/*.sh && shfmt -d scripts
      - run: desktop-file-validate packaging/*.desktop && bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian-stable-amd64
          path: dist/*.deb
