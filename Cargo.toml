[package]
name = "luma-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A native keyboard-driven GTK4 application launcher"
build = "build.rs"

[dependencies]
gio = { version = "0.22", features = ["v2_58"] }
gio-unix = { version = "0.22", features = ["v2_58"] }
glib = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "search"
harness = false
